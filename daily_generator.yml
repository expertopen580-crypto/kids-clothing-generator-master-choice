name: Daily Kids Clothing Generator

on:
  schedule:
    # Runs automatically every day at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual test runs directly from GitHub UI anytime

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Execute Python Generation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Securely passes your API key
        run: |
          python generate_kids.py

      - name: Upload Generated Images and Excel-Ready CSV
        uses: actions/upload-artifact@v4
        with:
          name: daily-kids-clothing-catalog
          path: ./output_*/*
